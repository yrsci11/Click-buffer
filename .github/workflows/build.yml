name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android 64-bit
            target: Android64
            platform: android64
          - name: Android 32-bit
            target: Android32
            platform: android32

    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          mkdir bin
          curl -s https://api.github.com/repos/geode-sdk/cli/releases/latest \
            | grep "browser_download_url.*linux.zip" \
            | cut -d : -f 2,3 \
            | tr -d \" \
            | wget -qi - -O geode-cli.zip
          unzip geode-cli.zip -d bin
          chmod +x bin/geode
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Install Loader Binaries
        run: geode sdk install-binaries -p ${{ matrix.config.platform }}

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.target }}
          path: build/*.geode
